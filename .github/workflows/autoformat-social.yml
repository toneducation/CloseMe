name: Autoformat Social Repair
on:
  push:
    branches:
      - fix/social-core-instagram-photo-20260923
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-core-instagram-photo-20260923
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write apps/bot/src/index.ts apps/bot/src/product.ts packages/shared/src/product-i18n.ts tests/database.test.ts
      - name: Commit formatting if needed
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/bot/src/index.ts apps/bot/src/product.ts packages/shared/src/product-i18n.ts tests/database.test.ts
            git commit -m "style: apply Prettier to social repair"
            git push origin HEAD:fix/social-core-instagram-photo-20260923
          fi
